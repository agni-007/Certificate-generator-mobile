name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Offline audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use pinned Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Core tests
        run: npm run test:core

      - name: Placement parity (pdf.js)
        run: npm run test:parity

      - name: Offline audit
        run: npm run offline-audit
